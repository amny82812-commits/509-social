const DATA={"u1":[{"t":"下列哪一個國家的位置不在東南亞？","o":["印尼","泰國","南韓","馬來西亞"],"a":2,"s":"選擇題","img":null,"note":null},{"t":"臺灣為何季風盛行？","o":["往來東北亞和東南亞兩地區，都會經過臺灣","臺灣的位置在大西洋和印度洋兩大洋之間","臺灣是亞洲東部通往太平洋必經的重要地方","臺灣位於最大陸地與最大海洋交會處"],"a":3,"s":"選擇題","img":null,"note":null},{"t":"亞洲、大洋洲和美洲皆與下列哪一個海洋相鄰呢？","o":["臺灣海峽","太平洋","大西洋","印度洋"],"a":1,"s":"選擇題","img":null,"note":null},{"t":"臺灣因為位於洋流交會處，因此帶來豐沛的生態資源。請問下列敘述何者有誤？","o":["每年春、夏交織之時，黑鮪魚會洄游至臺灣周圍海域","每年冬天，烏魚來到臺灣西南沿海地區產卵，故春節常以烏魚子作為伴手禮","每年夏季，黑面琵鷺成群前來臺灣避暑，待冬季再回到南方","洋流帶來豐沛物產，也順勢為各地帶來觀光人潮"],"a":2,"s":"選擇題","img":null,"note":null},{"t":"小軒和家人出去旅遊拍了許多照片，並與同學分享她在野銀舊部落傳統地下屋建築的照片。小軒是到哪裡旅遊？","o":["新竹","蘭嶼","綠島","屏東"],"a":1,"s":"選擇題","img":null,"note":null},{"t":"安娜是來自印尼的外籍移工，她搭乘飛機到臺灣時最不可能穿越哪一個海域？","o":["巴士海峽","大西洋","臺灣海峽","南海"],"a":1,"s":"選擇題","img":null,"note":null},{"t":"平平要從臺灣南部到新加坡旅遊，她搭乘的飛機會飛越哪一個海域？","o":["南海","東海","太平洋","印度洋"],"a":0,"s":"選擇題","img":null,"note":null},{"t":"語晴在國立臺灣史前文化博物館看到了一件精心磨製的人獸形玉器，導覽員告訴她這可能是交易而來的物品。這件玉器最可能來自什麼遺址？","o":["長濱遺址","卑南遺址","十三行遺址","以上皆是"],"a":1,"s":"選擇題","img":null,"note":null},{"t":"考古學家小倫在臺灣的某處遺址進行發掘時，發現一些打製石器和燒焦的動物骨骸。推測這些文物屬於哪個時代？","o":["舊石器時代","新石器時代","金屬器時代","銅器時代"],"a":0,"s":"選擇題","img":null,"note":null},{"t":"鈞鈞穿越回史前臺灣，來到史前遺址的聚落中。當地居民邀請他參加豐收祭典，同時他也看到他們使用石板棺安葬族人，並用陶器盛裝食物。根據這些線索，哪項敘述最不符合當時的情況？","o":["使用石刀收割農作物","用鐵製鐮刀收成水稻","以陶罐儲藏食物","飼養家畜"],"a":1,"s":"選擇題","img":null,"note":null},{"t":"在十三行遺址中因為發現什麼物品，使得考古學家推測當時的人們已與海外的人有貿易往來？","o":["琉璃珠","人獸形耳飾","陶罐","石板棺"],"a":0,"s":"選擇題","img":null,"note":null},{"t":"下列哪一項不是劃分新石器時代與舊石器時代的依據？","o":["是否懂得用火","是否有農業活動","是否飼養家畜","石器製作的方式"],"a":0,"s":"選擇題","img":null,"note":null},{"t":"阿信到十三行博物館進行戶外教育，請問他可能會看到下列哪些文物？A 煉鐵作坊；B 東南亞琉璃珠串；C 人面陶罐；D 鐮刀","o":["AB","ABD","ACD","ABCD"],"a":3,"s":"選擇題","img":null,"note":null},{"t":"關於史前時代人類製作的器具，依出現時間的先後順序，哪一項正確？","o":["陶器→石器→金屬器","石器→金屬器→陶器","石器→陶器→金屬器","陶器→金屬器→石器"],"a":2,"s":"選擇題","img":null,"note":null},{"t":"某學者研究臺灣原住民族的文化適應模式，發現不同族群會依據環境調整生活方式。以下哪個族群與其文化模式的對應最合理？","o":["邵族：海洋捕撈文化","雅美族（達悟族）：海洋漁獵文化","泰雅族：島嶼航海貿易","雅美族（達悟族）：農耕狩獵文化"]," function home(){unit=null;submitted=false;$('#app').innerHTML=`<div class="panel"><h2>選擇練習單元</h2><p class="hint">每題皆為單選；原本的判斷題改成「正確／錯誤」，填代號題改成點選代號。可以在交卷前修改答案。</p><div class="units"><button class="unit" onclick="start('u1')">第一單元<small>20 題選擇題＋4 題洋流判斷＋8 題世界地圖，共 32 題</small></button><button class="unit" onclick="start('u2')">第二單元<small>15 題選擇題＋7 題填代號＋2 題閱讀＋1 題地圖，共 25 題</small></button></div></div><p class="hint">答案已依教師確認修正；如其他題目與課本有出入，請以教師公布的答案為準。</p>`}
function start(u){unit=u;answers=Array(DATA[u].length).fill(null);submitted=false;render();window.scrollTo(0,0)}
function render(){let qs=DATA[unit],count=answers.filter(x=>x!==null).length;let out=`<div class="bar"><button class="toplink" onclick="confirmHome()">← 選單</button><b>${unit==='u1'?'第一':'第二'}單元</b><span id="progress">${count} / ${qs.length} 已作答</span><div class="meter"><div id="fill" class="fill" style="width:${count/qs.length*100}%"></div></div></div>`;let section='',shownImg='';qs.forEach((q,i)=>{if(q.s!==section){section=q.s;shownImg='';out+=`<h2 style="margin:28px 4px 10px">${esc(section)}</h2>`}out+=`<article class="question" id="q${i}"><span class="section">第 ${i+1} 題</span><h3>${esc(q.t)}</h3>`;if(q.s==='閱讀題組：媽祖'&&i===22)out+=`<p class="reading">${esc(DATA.reading)}</p>`;if(q.img&&shownImg!==q.img){out+=`<img class="qimg" alt="原試卷附圖" src="${q.img}">`;shownImg=q.img}out+=q.o.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${answers[i]===j?'checked':''} onchange="choose(${i},${j})"><span>${esc(o)}</span></label>`).join('');out+='</article>'});out+=`<div class="panel"><p class="hint">交卷後會顯示答對題數、得分及各題答案。每題權重相同。</p><div class="actions"><button class="btn" onclick="submitQuiz()">交卷並批改</button><button class="btn secondary" onclick="resetQuiz()">重新作答</button></div></div>`;$('#app').innerHTML=out}
function choose(i,j){answers[i]=j;let n=answers.filter(x=>x!==null).length;$('#progress').textContent=n+' / '+answers.length+' 已作答';$('#fill').style.width=(100*n/answers.length)+'%'}
function confirmHome(){if(confirm('返回選單將清除這次的作答，確定嗎？'))home()}
function resetQuiz(){if(confirm('確定清除所有作答，重新練習嗎？'))start(unit)}
function submitQuiz(){let qs=DATA[unit],n=answers.filter(x=>x===null).length;if(n&&!confirm(`還有 ${n} 題未作答，確定要交卷嗎？`))return;let right=qs.filter((q,i)=>answers[i]===q.a).length;let score=Math.round(right/qs.length*100);let out=`<div class="panel"><button class="toplink" onclick="home()">← 回到單元選單</button><h2>練習完成！</h2><div class="score">${score} 分</div><p>答對 <b>${right}</b> 題／共 ${qs.length} 題，答錯或未作答 <b>${qs.length-right}</b> 題。</p><div class="actions"><button class="btn" onclick="start(unit)">再練習一次</button><button class="btn secondary" onclick="home()">換一個單元</button></div><p class="hint">以下可逐題核對。答案已依教師確認的項目修正；如有疑義，請以老師公布的解答為準。</p></div><h2>作答回顧</h2>`;let section='',shownImg='';qs.forEach((q,i)=>{if(q.s!==section){section=q.s;shownImg='';out+=`<h3>${esc(section)}</h3>`}let ok=answers[i]===q.a;out+=`<article class="question ${ok?'correct':'wrong'}"><span class="section">第 ${i+1} 題 · ${ok?'答對':'需複習'}</span><h3>${esc(q.t)}</h3>`;if(q.s==='閱讀題組：媽祖'&&i===22)out+=`<p class="reading">${esc(DATA.reading)}</p>`;if(q.img&&shownImg!==q.img){out+=`<img class="qimg" src="${q.img}" alt="原試卷附圖">`;shownImg=q.img}out+=`<div class="answer">你的答案：${answers[i]===null?'未作答':esc(q.o[answers[i]])}<br><strong>參考答案：${esc(q.o[q.a])}</strong></div>`;if(q.note)out+=`<p class="check">※ ${esc(q.note)}</p>`;out+='</article>'});out+=`<div class="actions"><button class="btn" onclick="start(unit)">重新練習</button><button class="btn secondary" onclick="home()">回單元選單</button></div>`;$('#app').innerHTML=out;window.scrollTo(0,0)}
home();</script></body></html>
